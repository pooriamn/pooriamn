<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Validated experimental data workflow</title><desc id="d">Measurement file is validated, integrated, and atomically published with a digest. Invalid inputs leave the previous valid report unchanged.</desc><rect width="1200" height="640" rx="16" fill="#f4f7f8"/><g font-family="Arial,Helvetica,sans-serif"><rect x="44" y="40" width="36" height="4" rx="2" fill="#087e83"/><text x="44" y="68" font-size="16" font-weight="600" letter-spacing="2.2" fill="#087e83">03 / SCIENTIFIC AUTOMATION</text><text x="42" y="112" font-size="34" font-weight="700" letter-spacing="-.7" fill="#142c3a">A repeatable route from data to report</text><text x="44" y="143" font-size="18" fill="#4b6270">File-based experiment processing · validation before publication</text><rect x="44" y="169" width="1112" height="389" rx="10" fill="#fff" stroke="#d9e4e7"/>
<g stroke="#087e83" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M290 319H337l-8 -6m8 6l-8 6M558 319H605l-8 -6m8 6l-8 6M826 319H873l-8 -6m8 6l-8 6"/><path d="M447 382V428h0" stroke="#ad7961" stroke-dasharray="5 4"/></g>
<rect x="70" y="252" width="220" height="130" rx="8" fill="#f4f7f8" stroke="#d9e4e7" stroke-width="1.5"/><text x="87" y="278" fill="#087e83" font-size="14" font-weight="700">01</text><text x="87" y="311" fill="#142c3a" font-size="24" font-weight="700">Ingest</text><text x="87" y="338" fill="#4b6270" font-size="15">CSV measurements</text><text x="87" y="359" fill="#4b6270" font-size="14">Time, voltage, current</text><rect x="338" y="252" width="220" height="130" rx="8" fill="#f4f7f8" stroke="#d9e4e7" stroke-width="1.5"/><text x="355" y="278" fill="#087e83" font-size="14" font-weight="700">02</text><text x="355" y="311" fill="#142c3a" font-size="24" font-weight="700">Validate</text><text x="355" y="338" fill="#4b6270" font-size="15">Schema and values</text><text x="355" y="359" fill="#4b6270" font-size="14">Finite, ordered samples</text><rect x="606" y="252" width="220" height="130" rx="8" fill="#f4f7f8" stroke="#d9e4e7" stroke-width="1.5"/><text x="623" y="278" fill="#087e83" font-size="14" font-weight="700">03</text><text x="623" y="311" fill="#142c3a" font-size="24" font-weight="700">Integrate</text><text x="623" y="338" fill="#4b6270" font-size="15">Calculate power</text><text x="623" y="359" fill="#4b6270" font-size="14">Trapezoidal energy</text><rect x="874" y="252" width="220" height="130" rx="8" fill="#f4f7f8" stroke="#d9e4e7" stroke-width="1.5"/><text x="891" y="278" fill="#087e83" font-size="14" font-weight="700">04</text><text x="891" y="311" fill="#142c3a" font-size="24" font-weight="700">Publish</text><text x="891" y="338" fill="#4b6270" font-size="15">JSON + source hash</text><text x="891" y="359" fill="#4b6270" font-size="14">Atomic file replacement</text>
<rect x="338" y="428" width="220" height="87" rx="8" fill="#f7ece6" stroke="#c4937b"/><text x="355" y="454" font-size="16" font-weight="700" fill="#804c36">Reject invalid input</text><text x="355" y="478" font-size="14" fill="#804c36">Keep the previous report.</text><text x="355" y="499" font-size="13" fill="#804c36">No partial publication.</text>
<path d="M338 209H1094" stroke="#d9e4e7"/><text x="70" y="218" font-size="15" fill="#4b6270">INPUT</text><text x="1094" y="218" font-size="15" fill="#4b6270" text-anchor="end">REPRODUCIBLE OUTPUT</text>
<text x="70" y="534" font-size="14" fill="#4b6270">Same input → same summary · Source SHA-256 digest included in each report.</text><path d="M44 580H1156" stroke="#d9e4e7"/><text x="44" y="609" fill="#4b6270" font-size="15">Synthetic CSV example · Offline processing only; not a real-time instrument controller.</text><text x="1156" y="609" text-anchor="end" fill="#087e83" font-size="15" font-weight="600">POORIA MOOZARM NIA</text></g></svg>